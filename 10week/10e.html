<html>
    <head>
        <script>
            let a = 100;
            for(let i = 0; i <= a ; i++){
                if(i % 3 == 0 && i % 5 == 0){
                    document.write("LOL-OK<br>");
                }else if(i % 3 == 0){
                    document.write("LOL<br>");
                }
                else if(i % 5 == 0){
                    document.write("OK<br>");
                }
                else{
                    document.write(i + "<br>");
                }
            }   
        </script>
    </head>
</html>
