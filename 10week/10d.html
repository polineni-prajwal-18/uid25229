<html>
    <head>
        <script>
            let a = 15;
            for(let i = 0; i <= a ; i++){
                if(i % 2 == 0){
                    document.write(i + "  is Even<br>");
                }
                else{
                    document.write(i + "  is Odd<br>");
                }
            }
        </script>
    </head>
    <body>

    </body>
</html>
